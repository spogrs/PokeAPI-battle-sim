<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="Pokeapi.css">
    <script src="Pokeapi.js" defer></script>

</head>


<body onload="fetchPokemon()">

    <main>
        <div id="Pokemon-Container">
            <div class="pokegrid"></div>
        </div>
    </main>


    <!-- DEBUG BUTTONS TEMPORARY <button onclick="fetchPokemon()">Fetch Pokemon</button> -->
    <button onclick="">pick popout temp</button>
    <div id="Sort by region">
        <label for="Region-select">Filter by region:</label>
        <select id="Region-select" onchange="renderPokemons(document.getElementById('type-select').value, this.value)">
            <option value="">None</option>
            <option value="kanto">Kanto</option>
            <option value="johto">Johto</option>
            <option value="hoenn">Hoenn</option>
            <option value="sinnoh">Sinnoh</option>
            <option value="unova">Unova</option>
            <option value="kalos">Kalos</option>
            <option value="alola">Alola</option>
            <option value="galar">Galar</option>
        </select>
    </div>

    <div id="Sort by type">
        <label for="type-select">Filter by Type:</label>
        <select id="type-select" onchange="renderPokemons(this.value, document.getElementById('Region-select').value)">
            <option value="">None</option>
            <option value="bug">Bug</option>
            <option value="dark">Dark</option>
            <option value="dragon">Dragon</option>
            <option value="electric">Electric</option>
            <option value="fairy">Fairy</option>
            <option value="fighting">Fighting</option>
            <option value="fire">Fire</option>
            <option value="flying">Flying</option>
            <option value="ghost">Ghost</option>
            <option value="grass">Grass</option>
            <option value="ground">Ground</option>
            <option value="ice">Ice</option>
            <option value="normal">Normal</option>
            <option value="poison">Poison</option>
            <option value="psychic">Psychic</option>
            <option value="rock">Rock</option>
            <option value="steel">Steel</option>
            <option value="water">Water</option>
        </select>
    </div>



</body>



</html>
