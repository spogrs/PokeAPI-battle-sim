<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="Pokeapi.css">
    <script src="Pokeapi.js" defer></script>
</head>


<body onload="fetchPokemon(905)">

    <!-- Make the side panel and menu here-->
    <div id=Panel>
        <header>POKEMON</header><br>
        <section id="TeamBuilder">
            <section id="Sorting">
                <div>Sorting</div><br>

                <div id="Sort by region">
                    <label for="Region-select">Filter by region:</label>
                    <select id="Region-select"
                        onchange="renderPokemons(document.getElementById('type-select').value, this.value)">
                        <option value="">None</option>
                        <option value="kanto">Kanto</option>
                        <option value="johto">Johto</option>
                        <option value="hoenn">Hoenn</option>
                        <option value="sinnoh">Sinnoh</option>
                        <option value="unova">Unova</option>
                        <option value="kalos">Kalos</option>
                        <option value="alola">Alola</option>
                        <option value="galar">Galar</option>
                    </select>
                </div>

                <div id="Sort by type">
                    <label for="type-select">Filter by Type:</label>
                    <select id="type-select"
                        onchange="renderPokemons(this.value, document.getElementById('Region-select').value)">
                        <option value="">None</option>
                        <option class="type type-normal" value="normal">Normal</option>
                        <option class="type type-fire" value="fire">Fire</option>
                        <option class="type type-water" value="water">Water</option>
                        <option class="type type-electric" value="electric">Electric</option>
                        <option class="type type-grass" value="grass">Grass</option>
                        <option class="type type-ice" value="ice">Ice</option>
                        <option class="type type-fighting" value="fighting">Fighting</option>
                        <option class="type type-poison" value="poison">Poison</option>
                        <option class="type type-ground" value="ground">Ground</option>
                        <option class="type type-flying" value="flying">Flying</option>
                        <option class="type type-psychic" value="psychic">Psychic</option>
                        <option class="type type-bug" value="bug">Bug</option>
                        <option class="type type-rock" value="rock">Rock</option>
                        <option class="type type-ghost" value="ghost">Ghost</option>
                        <option class="type type-dragon" value="dragon">Dragon</option>
                        <option class="type type-dark" value="dark">Dark</option>
                        <option class="type type-steel" value="steel">Steel</option>
                        <option class="type type-fairy" value="fairy">Fairy</option>
                    </select>
                </div>

            </section>

            <section id="pokemoninfo" visible>
                <div class="profile-container">
                    <h2 id="selectedname"></h2>
                    <img src="" id="selectedsprite" class="hidden">
                </div>

                <div class="data-container">
                    <div id="selectedTypeRow" class="type-row">
                        <span id="Type1" class="type type-null"></span>
                        <span id="Type2" class="type type-null"></span>
                    </div>

                    <div id="statline">
                        <ol style="list-style: none;">
                            <li>HP<span id="HPstat">0</span></li>
                            <li>ATK<span id="ATKstat">0</span></li>
                            <li>DEF<span id="DEFstat">0</span></li>
                            <li>SpATK<span id="SpATKstat">0</span></li>
                            <li>SpDEF<span id="SpDEFstat">0</span></li>
                            <li>SPD<span id="SPDstat">0</span></li>
                            <li>BST<span id="BSTstat">0</span></li>
                        </ol>
                    </div>

                </div>
                <div id="Move-container">
                    <div class="move-slot">
                        <span id="Move1" class="move" onclick="changemove(1)"></span>
                        <select id="MoveSelect1" class="move-select" size="6" aria-label="Choose move 1" hidden
                            onchange="changeMoveSelection(1, this.value)"></select>
                    </div>
                    <div class="move-slot">
                        <span id="Move2" class="move" onclick="changemove(2)"></span>
                        <select id="MoveSelect2" class="move-select" size="6" aria-label="Choose move 2" hidden
                            onchange="changeMoveSelection(2, this.value)"></select>
                    </div>
                    <div class="move-slot">
                        <span id="Move3" class="move" onclick="changemove(3)"></span>
                        <select id="MoveSelect3" class="move-select" size="6" aria-label="Choose move 3" hidden
                            onchange="changeMoveSelection(3, this.value)"></select>
                    </div>
                    <div class="move-slot">
                        <span id="Move4" class="move" onclick="changemove(4)"></span>
                        <select id="MoveSelect4" class="move-select" size="6" aria-label="Choose move 4" hidden
                            onchange="changeMoveSelection(4, this.value)"></select>
                    </div>
                </div>

            </section>


            <section id="teams">
                <div class="team team-1 active" onclick="currentTeam !== 0 && switchTeam(1)">
                    <div class="team-status">Team 1: 0/6</div>
                    <div class="selected"></div>
                </div>

                <div class="team team-2" onclick="currentTeam !== 1 && switchTeam(2)">
                    <div class="team-status">Team 2: 0/6</div>
                    <div class="selected"></div>
                </div>
            </section>

            <button onclick="startbattle()" id="startbutton">Start Battle</button>



        </section>
        <section id="battleContainer">

            <div id="battleScreen">
                <div class="statusBox opponentStatus">
                    <div class="info">
                        <span class="name">placeholdername</span>
                        <span class="level">placeholderlvl</span>
                    </div>
                    <div class="hpBar">
                        <div class="hpFill"></div>
                    </div>
                    <div class="hpText">0/404</div>
                </div>

                <div class="spriteBox opponentSprite">
                    <img src="">
                </div>

                <div class="spriteBox playerSprite">
                    <img src="">
                </div>

                <div class="statusBox playerStatus">
                    <div class="info">
                        <span class="name">placeholdername</span>
                        <span class="level">placeholderlvl</span>
                    </div>
                    <div class="hpBar">
                        <div class="hpFill"></div>
                    </div>
                    <div class="hpText">0/404</div>
                </div>

                <div class="battleMenu">
                    <div class="dialogueText" id="dialogueText">What will your Pokémon do?</div>
                    <div class="actionGrid" id="actionGrid">
                        <section class="actionView mainActions" id="mainActions">
                            <button class="btn btnFight" type="button" onclick="showMoves()">FIGHT</button>
                            <button class="btn btnBag" type="button" onclick="showBag()">BAG</button>
                            <button class="btn btnPkmn" type="button" onclick="showPokemon()">POKEMON</button>
                            <button class="btn btnRun" type="button" onclick="confirmRun()">RUN</button>
                        </section>

                        <section class="actionView moveActions" id="moveActions" hidden>
                            <button class="btn moveButton" id="battleMove1" type="button"
                                onclick="chooseBattleMove(0)"></button>
                            <button class="btn moveButton" id="battleMove2" type="button"
                                onclick="chooseBattleMove(1)"></button>
                            <button class="btn moveButton" id="battleMove3" type="button"
                                onclick="chooseBattleMove(2)"></button>
                            <button class="btn moveButton" id="battleMove4" type="button"
                                onclick="chooseBattleMove(3)"></button>
                            <button class="btn backButton" type="button" onclick="showBattleActions()">BACK</button>
                        </section>

                        <section class="actionView swapActions" id="moveActions" hidden>
                            <button class="btn moveButton" id="battleMove1" type="button"
                                onclick="chooseBattleMove(0)"></button>
                            <button class="btn moveButton" id="battleMove2" type="button"
                                onclick="chooseBattleMove(1)"></button>
                            <button class="btn moveButton" id="battleMove3" type="button"
                                onclick="chooseBattleMove(2)"></button>
                            <button class="btn moveButton" id="battleMove4" type="button"
                                onclick="chooseBattleMove(3)"></button>
                            <button class="btn backButton" type="button" onclick="showBattleActions()">BACK</button>
                        </section>

                    </div>
                </div>




            </div>



    </div>


    </section>

    <footer id="sidefooter">
        <a href="https://github.com/spogrs/PokeAPI-battle-sim">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="white" display="inline-block" overflow="visible"
                style="vertical-align:text-bottom">
                <path
                    d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943">
                </path>
            </svg>
            <span style="font-weight: bold; color: white;">GitHub</span>
        </a>
        <!-- DEBUG BUTTONS TEMPORARY <button onclick="fetchPokemon()">Fetch Pokemon</button> -->
        <button onclick="toggleContainer('Pokemon-Container', 'open');">pick popout
            temp</button>
        <button onclick="Choose(Math.floor(Math.random() * 1000) + 1);">Debug Add random</button>
    </footer>


    </div>


    <!-- Pokemon grid container and cards-->
    <main>
        <div id="Pokemon-Container" class="open">
            <div class="pokegrid"></div>
        </div>
    </main>







</body>



</html>
